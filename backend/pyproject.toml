[project]
name = "icrm-ca-backend"
version = "0.1.0"
description = "ICRM-CA modular monolith backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.15.2",
  "argon2-cffi==23.1.0",
  "fastapi==0.115.12",
  "pydantic-settings==2.8.1",
  "psycopg[binary]==3.2.6",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.0",
  "minio==7.2.15",
  "python-multipart==0.0.20",
  "pymupdf==1.28.2",
  "pillow==12.3.0",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.2",
  "testcontainers[minio,postgres]==4.10.0",
]

[project.scripts]
icrm-create-admin = "app.cli:create_admin_command"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
