# Production TLS reverse proxy. This is the ONLY service exposed to the
# network; Postgres, MinIO, the API, and the worker stay on the internal
# Compose network. TLS certificates are mounted from the host at
# ./certs/fullchain.pem and ./certs/privkey.pem (the operator provides them).

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health/ {
    proxy_pass http://api:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
